name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build workspace
        run: cargo build --workspace
      - name: Test workspace
        # Tests requiring administrator privileges are #[ignore].
        run: cargo test --workspace
      - name: Build cross-language protocol fixture
        run: dotnet build crates/ipc/tests/dotnet/ProtocolSmoke.csproj -c Release
      - name: Test GUI pipe framing, notifications and reconnect
        run: cargo test -p ipc --test dotnet -- --ignored --nocapture
      - name: Test GUI error codes, password retries and long mount timeout
        run: dotnet run --project gui/ProtocolChecks/ProtocolChecks.csproj -c Release
      - name: Validate test script syntax (Windows PowerShell)
        shell: powershell
        run: ./tests/Validate-Syntax.ps1
      - name: Validate test script syntax (PowerShell 7)
        shell: pwsh
        run: ./tests/Validate-Syntax.ps1
      - name: Test non-admin script helpers
        # The fake CLI console executable is compiled with .NET Framework Add-Type.
        shell: powershell
        run: ./tests/Validate-Helpers.ps1

  gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Build WinUI GUI
        # The project pins portable MSIX PRI/XAML tooling for SDK-only builds.
        run: dotnet build gui/Inocrium.sln -c Release -p:Platform=x64

  installer:
    needs: [rust, gui]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Build x64 MSI
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          $version = '0.1.0'
          if ($env:RELEASE_REF.StartsWith('refs/tags/v')) {
            $version = $env:RELEASE_REF.Substring('refs/tags/v'.Length)
          }
          ./installer/build.ps1 -Configuration Release -Platform x64 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: inocrium-reflect-msi-x64
          path: installer/out/x64/*.msi
          if-no-files-found: error
